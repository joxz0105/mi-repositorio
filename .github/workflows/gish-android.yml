name: Gish Android

on:
  push:
    paths:
      - 'gish-android/**'
      - '.github/workflows/gish-android.yml'
  pull_request:
    paths:
      - 'gish-android/**'
      - '.github/workflows/gish-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: gish-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager --install "ndk;26.3.11579264"

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gish-debug-apk
          path: gish-android/gish/build/outputs/apk/debug/*.apk
          if-no-files-found: error
