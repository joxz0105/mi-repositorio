name: Gish Android

on:
  push:
    paths:
      - 'gish-android/**'
      - '.github/workflows/gish-android.yml'
  pull_request:
    paths:
      - 'gish-android/**'
      - '.github/workflows/gish-android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner image already ships the Android SDK, so there is no
      # third-party setup action here: fewer moving parts, and it keeps working
      # on repositories that restrict Actions to GitHub-authored ones.
      - name: Show Android SDK environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/ndk" || echo "no ndk directory"

      - name: Install NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;26.3.11579264" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: gish-android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gish-debug-apk
          path: gish-android/gish/build/outputs/apk/debug/*.apk
          if-no-files-found: error
